name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from idling
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s -f https://myrahbar-backend.onrender.com/api/health || true
